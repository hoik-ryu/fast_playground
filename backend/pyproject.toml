[project]
name = "fast-backend"
version = "0.1.0"
description = "FastAPI backend boilerplate"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.18.5",
    "fastapi[standard]>=0.139.0",
    "psycopg==3.3.4",
    "pwdlib[argon2]==0.3.0",
    "pydantic-settings==2.14.2",
    "pyjwt==2.13.0",
    "python-dotenv==1.2.2",
    "ruff==0.15.20",
    "sqlalchemy==2.0.51",
]

[project.scripts]
console = "app.console:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["app"]
indent-width = 2

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = [
    "B008",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "ipython>=9.0",
    "ruff>=0.15.20",
]
