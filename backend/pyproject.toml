[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (undefined name, unused import 등)
    "I",   # isort (import 정렬)
    "UP",  # pyupgrade (구식 문법 개선)
    "B",   # flake8-bugbear (흔한 버그 패턴)
]
ignore = [
    "B008",  # FastAPI Depends(get_db) 패턴은 정상
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
